<title>Curio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: a specimen cabinet. Saved things are paper objects laid in a lined drawer, each with an accession number and a
   Latin classification; a glass case lid (the search dock) floats above them; opening one shows its catalogue record. */
:root {
  /* the drawer lining: Linen by day (the page rewrites these from the chosen lining) */
  --lining: #e7e2d6;
  --weave: rgba(80, 60, 30, .055);
  --on-lining: #24211b;
  --on-lining-muted: #6d675b;
  --hairline: rgba(36, 33, 27, .16);
  --accent: #b8301c;
  --glass-rgb: 250 248 242;
  --glass-edge: rgba(255, 255, 255, .7);
  --sheen: rgba(255, 255, 255, .5);
  --shade: rgba(30, 25, 15, .45);
  --rest: 0 1px 1px rgba(40, 30, 15, .14), 0 8px 16px -8px rgba(40, 30, 15, .35);
  --lift: 0 2px 3px rgba(40, 30, 15, .12), 0 24px 40px -14px rgba(40, 30, 15, .42);
  --rest-f: drop-shadow(0 1px 1px rgba(40, 30, 15, .2)) drop-shadow(0 6px 7px rgba(40, 30, 15, .16));
  --lift-f: drop-shadow(0 2px 2px rgba(40, 30, 15, .18)) drop-shadow(0 18px 18px rgba(40, 30, 15, .26));
  --aura-1: #ffd59a;
  --aura-2: #f6b48f;
  --aura-3: #c9d8e8;
  --aura-o: .42;

  /* paper objects keep their material on every lining */
  --paper: #fcfaf4;
  --paper-2: #f4efe3;
  --receipt: #fdfdfa;
  --ink: #1f1c17;
  --ink-2: #6a6458;
  --hair-paper: rgba(31, 28, 23, .18);
  --stamp: #c2321f;
  --rule-blue: #b3c6e0;
  --rule-red: #e0897b;
  --brass-1: #e6c97e;
  --brass-2: #9a782b;
  --brass-ink: #3b2d0c;
  --danger: #b42318;

  /* type */
  --font-display: "Bodoni Moda", "Didot", "Bodoni 72", "Iowan Old Style", Georgia, serif;
  --font-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* material */
  --radius: 3px;
  --tilt-k: 1;
  --glass-a: .46;
  --blur: 24px;
  --glass: rgb(var(--glass-rgb) / var(--glass-a));
  --glass-strong: rgb(var(--glass-rgb) / min(.94, calc(var(--glass-a) + .32)));
  --gap: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lining: #1c2e29; --weave: rgba(255, 255, 255, .03); --on-lining: #ece8dc; --on-lining-muted: #a7b3a8;
    --hairline: rgba(236, 232, 220, .16); --accent: #e2c172; --glass-rgb: 28 46 41; --glass-edge: rgba(255, 255, 255, .12);
    --sheen: rgba(255, 255, 255, .08); --shade: rgba(0, 0, 0, .6);
    --rest: 0 1px 1px rgba(0, 0, 0, .35), 0 10px 18px -8px rgba(0, 0, 0, .6);
    --lift: 0 2px 4px rgba(0, 0, 0, .35), 0 28px 44px -14px rgba(0, 0, 0, .75);
    --rest-f: drop-shadow(0 1px 1px rgba(0, 0, 0, .4)) drop-shadow(0 7px 8px rgba(0, 0, 0, .35));
    --lift-f: drop-shadow(0 2px 3px rgba(0, 0, 0, .4)) drop-shadow(0 20px 20px rgba(0, 0, 0, .5));
    --aura-1: #ffcf8a; --aura-2: #e9a46b; --aura-3: #7fb0a0; --aura-o: .2;
    --paper: #f1ece0; --paper-2: #e7e0cf; --receipt: #f3f2ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lining: #1c2e29; --weave: rgba(255, 255, 255, .03); --on-lining: #ece8dc; --on-lining-muted: #a7b3a8;
  --hairline: rgba(236, 232, 220, .16); --accent: #e2c172; --glass-rgb: 28 46 41; --glass-edge: rgba(255, 255, 255, .12);
  --sheen: rgba(255, 255, 255, .08); --shade: rgba(0, 0, 0, .6);
  --rest: 0 1px 1px rgba(0, 0, 0, .35), 0 10px 18px -8px rgba(0, 0, 0, .6);
  --lift: 0 2px 4px rgba(0, 0, 0, .35), 0 28px 44px -14px rgba(0, 0, 0, .75);
  --rest-f: drop-shadow(0 1px 1px rgba(0, 0, 0, .4)) drop-shadow(0 7px 8px rgba(0, 0, 0, .35));
  --lift-f: drop-shadow(0 2px 3px rgba(0, 0, 0, .4)) drop-shadow(0 20px 20px rgba(0, 0, 0, .5));
  --aura-1: #ffcf8a; --aura-2: #e9a46b; --aura-3: #7fb0a0; --aura-o: .2;
  --paper: #f1ece0; --paper-2: #e7e0cf; --receipt: #f3f2ec;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--lining);
  background-image:
    repeating-linear-gradient(0deg, var(--weave) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--weave) 0 1px, transparent 1px 3px);
  color: var(--on-lining);
  font: 400 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spec :focus-visible, .sheet :focus-visible, .composer :focus-visible { outline-color: var(--stamp); }

/* ---------- lamplight ---------- */
.aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--aura-o); }
.aura span {
  position: absolute;
  width: 75vmax;
  height: 75vmax;
  border-radius: 50%;
  will-change: transform;
  animation: drift 44s ease-in-out infinite alternate;
}
.aura span:nth-child(1) { background: radial-gradient(circle, var(--a1, var(--aura-1)) 0%, transparent 62%); top: -32vmax; left: -22vmax; }
.aura span:nth-child(2) { background: radial-gradient(circle, var(--a2, var(--aura-2)) 0%, transparent 62%); top: 8vmax; right: -38vmax; animation-duration: 52s; animation-delay: -14s; }
.aura span:nth-child(3) { background: radial-gradient(circle, var(--a3, var(--aura-3)) 0%, transparent 62%); bottom: -42vmax; left: 12vmax; animation-duration: 60s; animation-delay: -26s; }
@keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.1); } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--lining); }

/* ---------- glass: the case ---------- */
.glass {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-edge), 0 10px 30px rgba(0, 0, 0, .12);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
  backdrop-filter: blur(var(--blur)) saturate(170%);
  color: var(--on-lining);
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(115deg, var(--sheen), transparent 30%, transparent 62%, var(--sheen) 64%, transparent 70%);
  opacity: .8;
}
.glass > * { position: relative; }
.fx { position: absolute; width: 0; height: 0; overflow: hidden; }

.shell {
  position: relative;
  z-index: 1;
  max-width: 1480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}

/* ---------- header ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.plate {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 7px 14px;
  border-radius: 4px;
  background: linear-gradient(160deg, var(--brass-1), var(--brass-2) 55%, var(--brass-1));
  color: var(--brass-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 0 rgba(0, 0, 0, .25), 0 2px 5px rgba(0, 0, 0, .25);
  font: 600 15px/1 var(--font-display);
  letter-spacing: .34em;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255, 240, 200, .6);
  padding-right: calc(14px - .34em);
}
.plate i { width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3c4, #6f5214); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .3); }
.top-right { display: flex; align-items: center; gap: 14px; }
.tally { font: 400 12px/1.4 var(--font-type); color: var(--on-lining-muted); font-variant-numeric: tabular-nums; }
.make {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--on-lining);
  border-radius: 999px;
  padding: 5px 13px 5px 7px;
  font: 500 13px/1.3 var(--font-ui);
  cursor: pointer;
}
.make .swatch { width: 18px; height: 18px; border-radius: 50%; background: var(--lining); box-shadow: inset 0 0 0 1px var(--hairline), inset 0 0 0 4px var(--paper); }

.dock {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 20;
  display: grid;
  gap: 12px;
  padding: 10px 20px 14px;
  border-radius: 18px;
}
.search { display: flex; align-items: center; gap: 12px; }
.search input {
  flex: 1;
  width: 0;
  min-width: 0;
  border: 0;
  background: transparent;
  font: italic 400 clamp(30px, 4.6vw, 50px)/1.15 var(--font-display);
  letter-spacing: -.01em;
  padding: 2px 0 4px;
  outline: none;
}
.search input::placeholder { color: var(--on-lining-muted); opacity: .8; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { border: 0; background: transparent; color: var(--on-lining-muted); font: 400 13px var(--font-type); padding: 8px 4px; cursor: pointer; }
.search .key { font: 400 11px var(--font-type); color: var(--on-lining-muted); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--on-lining);
  border-radius: 999px;
  padding: 5px 12px;
  font: 500 13px/1.3 var(--font-ui);
  cursor: pointer;
  white-space: nowrap;
}
.chip:hover { border-color: var(--on-lining-muted); }
.chip .n { font: 400 11px var(--font-type); color: var(--on-lining-muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--on-lining); color: var(--lining); border-color: var(--on-lining); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.space { border-style: dashed; }
.chip.space[aria-pressed="true"] { border-style: solid; }
.chip .x { font: 400 12px var(--font-type); opacity: .7; padding-left: 2px; }
.chip.save { color: var(--accent); border-color: transparent; padding-inline: 6px; }
.chip svg { width: 13px; height: 13px; }
.chips .divider { width: 1px; height: 18px; background: var(--hairline); margin-inline: 4px; }
.space-form { display: inline-flex; gap: 6px; align-items: center; }
.space-form input {
  border: 1px solid var(--accent);
  background: var(--glass-strong);
  border-radius: 999px;
  padding: 5px 12px;
  font: 500 13px var(--font-ui);
  width: 180px;
  outline: none;
}

/* ---------- the drawer ---------- */
.wall {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  gap: var(--gap);
  align-items: start;
  padding-top: 6px;
}
.col { display: grid; gap: var(--gap); min-width: 0; }

.spec {
  --tilt: 0deg;
  position: relative;
  cursor: pointer;
  color: var(--ink);
  transform: rotate(calc(var(--tilt) * var(--tilt-k)));
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), filter .32s ease;
  min-width: 0;
  outline: none;
}
.spec:hover, .spec:focus-visible { transform: translateY(-6px) rotate(0deg) scale(1.012); z-index: 3; }
.spec:active { transform: translateY(-2px) scale(.99); }
.spec:focus-visible .obj { box-shadow: 0 0 0 2px var(--accent), var(--lift); }
.obj {
  position: relative;
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--rest);
  overflow: hidden;
  transition: box-shadow .32s ease;
}
.spec:hover .obj { box-shadow: var(--lift); }
.obj::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .45), transparent 65%);
  mix-blend-mode: soft-light;
  opacity: 0;
  transition: opacity .3s ease;
}
.spec:hover .obj::after { opacity: 1; }
.spec.masked { filter: var(--rest-f); }
.spec.masked:hover { filter: var(--lift-f); }
.spec.masked .obj, .spec.masked:hover .obj { box-shadow: none; }
.spec.enter { animation: settle .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
@keyframes settle { from { transform: translateY(-18px) rotate(calc(var(--tilt) * -3)); } }

/* the label every specimen carries */
.label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px 10px;
  border-top: 1px dashed var(--hair-paper);
  min-width: 0;
}
.genus { font: italic 400 14px/1.2 var(--font-display); color: var(--ink-2); flex: none; }
.terms { font: 400 11px/1.3 var(--font-type); color: var(--ink-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
.acc {
  flex: none;
  margin-left: auto;
  font: 700 10.5px/1 var(--font-type);
  letter-spacing: .08em;
  color: var(--stamp);
  border: 1.5px solid currentColor;
  border-radius: 3px;
  padding: 3px 5px 2px;
  transform: rotate(-4deg);
  opacity: .85;
  mix-blend-mode: multiply;
}
.thinking { display: inline-flex; align-items: center; gap: 6px; color: var(--stamp); font: 400 11px var(--font-type); }
.thinking::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }

/* hover actions sit on the case glass */
.quick {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 4;
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .2s ease, transform .2s ease;
}
.spec:hover .quick, .spec:focus-within .quick { opacity: 1; transform: none; }
.quick button, .quick a {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--on-lining);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.quick button:hover, .quick a:hover { background: var(--glass-strong); }
.quick button[aria-pressed="true"] { color: var(--accent); }
.quick svg { width: 15px; height: 15px; }
.sticker {
  position: absolute;
  top: -6px;
  right: 14px;
  z-index: 3;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--brass-ink);
  background: radial-gradient(circle at 35% 30%, var(--brass-1), var(--brass-2));
  box-shadow: 0 2px 3px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .5);
  transform: rotate(12deg);
}
.sticker svg { width: 14px; height: 14px; }
.spec:hover .sticker { opacity: 0; }
@media (hover: none) { .quick { display: none; } .spec:hover .sticker { opacity: 1; } }

/* index card (notes) */
.idx-head {
  padding: 12px 14px 7px;
  border-bottom: 1.5px solid var(--rule-red);
  font: 700 12.5px/1.3 var(--font-type);
  letter-spacing: .05em;
  text-transform: uppercase;
  min-height: 38px;
  overflow-wrap: anywhere;
}
.idx-head.dated { color: var(--ink-2); font-weight: 400; }
.lined {
  margin: 6px 14px 8px;
  font: 400 13.5px/22px var(--font-type);
  background: repeating-linear-gradient(transparent 0 21px, var(--rule-blue) 21px 22px);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: calc(22px * 11);
  overflow: hidden;
}

/* receipt (checklists) */
.spec-receipt .obj {
  --z: 7px;
  background: var(--receipt);
  padding-bottom: var(--z);
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--z)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--z) * 2) var(--z) repeat-x;
  mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--z)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--z) * 2) var(--z) repeat-x;
}
.receipt { padding: 16px 16px 6px; font: 400 13px/1.5 var(--font-type); display: grid; gap: 2px; }
.receipt .rh { text-align: center; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; overflow-wrap: anywhere; }
.receipt .rs { text-align: center; font-size: 11px; color: var(--ink-2); letter-spacing: .06em; }
.receipt .rule { border-top: 1px dashed var(--ink-2); margin: 8px 0; opacity: .6; }
.todo { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; cursor: pointer; }
.todo input { margin: 3px 0 0; accent-color: var(--ink); cursor: pointer; }
.todo.done span { color: var(--ink-2); text-decoration: line-through; }
.receipt .total { display: flex; justify-content: space-between; font-weight: 700; letter-spacing: .06em; }
.barcode { height: 30px; margin: 10px 8px 2px; }
.receipt .foot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-2); letter-spacing: .06em; }

/* letterpress slip (quotes) */
.spec-quote .obj { background: var(--paper-2); }
.slip { padding: 22px 20px 6px; display: grid; gap: 10px; }
.slip blockquote {
  margin: 0;
  font: italic 400 23px/1.2 var(--font-display);
  letter-spacing: -.005em;
  overflow-wrap: anywhere;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .7);
}
.slip .source { font: 500 15px/1.2 var(--font-display); font-variant: small-caps; letter-spacing: .06em; color: var(--ink-2); }
.slip .fleuron { text-align: center; color: var(--stamp); font: 400 16px/1 var(--font-display); opacity: .8; }

/* admission ticket (links) */
.spec-ticket .obj {
  --stub: 58px;
  background-color: hsl(var(--h) 42% 87%);
  background-image: repeating-radial-gradient(circle at 110% -10%, transparent 0 7px, hsl(var(--h) 40% 72% / .35) 7px 8px);
  -webkit-mask: radial-gradient(circle 9px at 0 calc(100% - var(--stub)), #0000 96%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 9px at 100% calc(100% - var(--stub)), #0000 96%, #000) 100% 0 / 51% 100% no-repeat;
  mask: radial-gradient(circle 9px at 0 calc(100% - var(--stub)), #0000 96%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 9px at 100% calc(100% - var(--stub)), #0000 96%, #000) 100% 0 / 51% 100% no-repeat;
}
.tk-main { padding: 14px 18px 14px; display: grid; gap: 6px; }
.tk-kicker { display: flex; justify-content: space-between; gap: 8px; font: 700 10.5px/1 var(--font-type); letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--h) 40% 30%); }
.tk-site { font: 800 30px/.95 var(--font-display); letter-spacing: -.01em; overflow-wrap: break-word; color: hsl(var(--h) 45% 18%); }
.tk-title { font: 600 14px/1.3 var(--font-ui); overflow-wrap: anywhere; }
.tk-note { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.tk-price { font: 800 34px/1 var(--font-display); color: hsl(var(--h) 45% 18%); }
.tk-perf { border-top: 2px dashed hsl(var(--h) 30% 55% / .7); margin: 0 14px; }
.tk-stub { height: var(--stub); padding: 0 18px; display: flex; align-items: center; gap: 10px; }
.tk-stub .domain { font: 400 11px var(--font-type); color: var(--ink-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }

/* paint chips (palettes) */
.fan { padding: 10px 10px 4px; display: grid; gap: 4px; }
.chipc {
  display: grid;
  grid-template-columns: 1fr auto;
  height: 36px;
  border: 0;
  padding: 0;
  background: none;
  cursor: copy;
  text-align: left;
  transition: transform .2s ease;
}
.chipc:hover { transform: translateX(4px); }
.chipc i { background: var(--c); border-radius: 2px 0 0 2px; }
.chipc span { display: flex; align-items: center; padding: 0 10px; font: 700 11px var(--font-type); text-transform: uppercase; letter-spacing: .06em; background: var(--paper-2); border-radius: 0 2px 2px 0; }
.fan-title { padding: 6px 14px 4px; font: 700 12.5px/1.3 var(--font-type); letter-spacing: .05em; text-transform: uppercase; }

/* pinned specimen (images) */
.spec-image .obj { padding: 14px 12px 0; }
.pin {
  position: absolute;
  top: 5px;
  left: 50%;
  z-index: 2;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transform: translateX(-50%);

  function applyLook() {

    const brands = (navigator.userAgentData && navigator.userAgentData.brands) || [];

    // Displacement map: neutral grey inside, a convex bezel near the rounded edge that pulls the backdrop inward.
    function bezelMap(w, hgt, r, bezel) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = hgt;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(w, hgt);
      const d = img.data;
      const hw = w / 2, hh = hgt / 2;
      r = Math.min(r, hw, hh);
      for (let y = 0; y < hgt; y++) {
        const py = y + 0.5 - hh;
        const qy = Math.abs(py) - (hh - r);
        for (let x = 0; x < w; x++) {
          const px = x + 0.5 - hw;
          const qx = Math.abs(px) - (hw - r);
          const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
          const out = Math.hypot(ox, oy);
          const inside = -(out + Math.min(Math.max(qx, qy), 0) - r);

            let nx = 0, ny = 0;
            if (ox > 0 || oy > 0) { nx = (ox / (out || 1)) * Math.sign(px); ny = (oy / (out || 1)) * Math.sign(py); }
            else if (qx > qy) nx = Math.sign(px);
            else ny = Math.sign(py);
            const t = 1 - inside / bezel;
            const m = 1 - Math.sqrt(1 - t * t);
            dx = -nx * m;
            dy = -ny * m;
          }
          const i = (y * w + x) * 4;
          d[i] = 128 + dx * 127;
          d[i + 1] = 128 + dy * 127;
          d[i + 2] = 128;
          d[i + 3] = 255;

  // ---------- storage: cloud (Claude account) or this browser ----------
  function makeQueue() {
    const chains = new Map();
    return (key, fn) => {
      const prev = chains.get(key) || Promise.resolve();
      const next = prev.catch(() => {}).then(fn);
      chains.set(key, next);
      next.finally(() => { if (chains.get(key) === next) chains.delete(key); });
      return next;
    };

  function cloudStore(db, viewerId) {

    return {
      mode: "cloud",
      subscribe(onItems, onMeta) {
        items.orderBy("createdAt", "desc").limit(1000).onSnapshot(
          (snap) => onItems(snap.docs.map((d) => ({ ...d.data(), id: d.id }))),
          (e) => toast("Lost connection to your saved items. Reload to reconnect. (" + e.code + ")")
        );
        root.onSnapshot((snap) => onMeta(snap.exists ? snap.data() : {}), () => {});
      },
      put(item) {
        latest.set(item.id, item);
        return queue(item.id, async () => {
          const body = latest.get(item.id);
          if (!body) return;
          latest.delete(item.id);
          const { id, ...rest } = body;
          await items.doc(id).set(JSON.parse(JSON.stringify(rest)));

      remove(id) {
        latest.delete(id);

  function localStore() {

  // ---------- what kind of specimen ----------
  const HEX = /#(?:[0-9a-f]{6}|[0-9a-f]{3})\b/gi;

  // ---------- specimen pieces ----------
  const cardCache = new Map();

  function toggleTodo(it, index) {
    const lines = String(it.text || "").split("\n");
    lines[index] = lines[index].replace(/\[( |x|X)\]/, (m, c) => (c === " " ? "[x]" : "[ ]"));
    save({ ...it, text: lines.join("\n") });
  }

  function label(it, extra) {
    const terms = (it.tags || []).filter((t) => t !== "example").slice(0, 3);
    return h("div", { class: "label" },
      h("span", { class: "genus", text: genusOf(it) }),

  function chipsFan(colors) {
    return h("div", { class: "fan" }, colors.map((c) => h("button", {
      class: "chipc", type: "button", style: "--c:" + c, "aria-label": "Copy " + c, title: "Copy " + c,
      onclick: (e) => { e.stopPropagation(); copyText(c, "Copied " + c); },
    }, h("i"), h("span", { text: c }))));
  }

  function barcode(seed) {
    let x = hash(seed) || 7, pos = 0;
    const stops = [];
    while (pos < 100) {
      x = (x * 1103515245 + 12345) >>> 0;
      const w = 0.6 + (x % 4) * 0.7;
      const gap = 0.5 + ((x >>> 8) % 3) * 0.6;
      stops.push("var(--ink) " + pos.toFixed(2) + "% " + Math.min(100, pos + w).toFixed(2) + "%", "transparent " + Math.min(100, pos + w).toFixed(2) + "% " + Math.min(100, pos + w + gap).toFixed(2) + "%");
      pos += w + gap;
    }
    return h("div", { class: "barcode", "aria-hidden": "true", style: "background:linear-gradient(90deg," + stops.join(",") + ")" });
  }

  function imageSrc(it) { return it.assetId ? "/_blob/" + it.assetId : it.image || ""; }

  function ticket(it) {
    const kind = linkKind(it.url);
    const price = kind === "shop" ? priceIn(it) : "";
    const obj = h("div", { class: "obj", style: "--h:" + hueOf(domainOf(it.url) || it.url || "") },
      h("div", { class: "tk-main" },
        h("div", { class: "tk-kicker" }, h("span", { text: TICKET[kind][0] }), h("span", { text: "№ " + accLabel(it).slice(4) })),
        price ? h("div", { class: "tk-price", text: price }) : h("div", { class: "tk-site", text: siteName(it.url).replace(/\./g, ".​") }),
        h("div", { class: "tk-title", text: it.title || titleFromUrl(it.url) }),
        it.text ? h("div", { class: "tk-note", text: it.text.slice(0, 200) }) : null),
      h("div", { class: "tk-perf", "aria-hidden": "true" }),
      h("div", { class: "tk-stub" },
        h("span", { class: "genus", text: TICKET[kind][1] }),
        it.aiStatus === "pending" ? h("span", { class: "thinking", text: "cataloguing" }) : h("span", { class: "domain", text: domainOf(it.url) }),
        h("span", { class: "acc", text: accLabel(it) })));
    return obj;
  }

  function objectFor(it) {
    const f = formOf(it);
    if (f === "image") {
      const ratio = it.w && it.h ? it.h / it.w : 1;
      return h("div", { class: "obj" },
        h("span", { class: "pin", "aria-hidden": "true" }),
        h("div", { class: "mount", style: "--tint:" + (it.tint || "var(--paper-2)") + ";aspect-ratio:" + (1 / ratio).toFixed(4) },
          h("img", { src: imageSrc(it), alt: it.title || it.summary || "Saved image", loading: "lazy", decoding: "async" })),
        it.title ? h("div", { class: "specimen-name", text: it.title }) : null,
        label(it, (it.colors || []).length ? h("span", { class: "pigments", "aria-label": "Colours: " + it.colors.join(", ") }, it.colors.map((c) => h("i", { style: "background:" + c }))) : null));
    }
    if (f === "ticket") return ticket(it);
    if (f === "quote") {
      return h("div", { class: "obj" },
        h("div", { class: "slip" },
          h("blockquote", { text: "“" + (it.text || "").replace(/^["“]|["”]$/g, "") + "”" }),
          it.source ? h("div", { class: "source", text: "— " + it.source }) : null,
          h("div", { class: "fleuron", "aria-hidden": "true", text: "❦" })),

    }
    if (f === "palette") {
      return h("div", { class: "obj" }, chipsFan(paletteOf(it)), h("div", { class: "fan-title", text: it.title || "Untitled palette" }), label(it));
    }
    if (f === "receipt") {
      const lines = parseTodos(it.text);
      const todos = lines.filter((l) => l.todo);
      const done = todos.filter((l) => l.done).length;
      const rows = [];
      lines.forEach((l, idx) => {
        if (!l.todo) { if (l.text.trim()) rows.push(h("div", { text: l.text })); return; }
        const cb = h("input", { type: "checkbox", "aria-label": l.text, checked: l.done, onclick: (e) => { e.stopPropagation(); toggleTodo(it, idx); } });
        rows.push(h("label", { class: "todo" + (l.done ? " done" : ""), onclick: (e) => e.stopPropagation() }, cb, h("span", { text: l.text })));
      });
      return h("div", { class: "obj" },
        h("div", { class: "receipt" },
          h("div", { class: "rh", text: it.title || "Agenda" }),
          h("div", { class: "rs", text: typedDate(it.createdAt) }),
          h("div", { class: "rule" }),
          rows,
          h("div", { class: "rule" }),
          h("div", { class: "total" }, h("span", { text: "DONE" }), h("span", { text: done + " / " + todos.length })),
          barcode(it.id),
          h("div", { class: "foot" }, h("span", { text: accLabel(it) }), it.aiStatus === "pending" ? h("span", { class: "thinking", text: "cataloguing" }) : h("span", { text: (it.tags || []).filter((t) => t !== "example").slice(0, 2).join(" · ").toUpperCase() }))));
    }
    return h("div", { class: "obj" },
      h("div", { class: "idx-head" + (it.title ? "" : " dated"), text: it.title || typedDate(it.createdAt) }),
      it.text ? h("div", { class: "lined", text: it.text }) : null,
      label(it));
  }

  function toggleFav(id) {

  function buildCard(it) {
    const f = formOf(it);
    const open = () => openDetail(it.id);
    const name = it.title || (it.text || "").slice(0, 60) || genusOf(it);
    const spec = h("article", {
      class: "spec spec-" + f + (f === "ticket" || f === "receipt" ? " masked" : ""), tabindex: "0", role: "button",
      "aria-label": genusOf(it) + " " + accLabel(it) + ": " + name,
      style: "--tilt:" + (((hash(it.id) % 7) - 3) * 0.3).toFixed(2) + "deg",
      onclick: open,
    });
    spec.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === spec) open(); });
    spec.append(objectFor(it));
    if (it.fav) spec.append(h("span", { class: "sticker", "aria-hidden": "true" }, icon("starOn")));
    spec.append(quickActions(it));
    return spec;

  function cardFor(it) {
    const key = it.id;
    const hit = cardCache.get(key);
    const acc = accLabel(it);
    if (hit && hit.item === it && hit.acc === acc) return hit.el;
    const el = buildCard(it);
    cardCache.set(key, { item: it, el, acc });
    return el;
  }

  function estimateHeight(it, w) {
    const cpl = Math.max(16, (w - 28) / 8.1);
    const lines = (t, cap) => Math.min(cap, String(t || "").split("\n").reduce((n, l) => n + Math.max(1, Math.ceil(l.length / cpl)), 0));
    const lab = 40;
    const f = formOf(it);
    if (f === "image") return 14 + (w - 24) * (it.w && it.h ? it.h / it.w : 1) + (it.title ? 34 : 0) + lab;
    if (f === "ticket") return 104 + (it.text ? 20 * lines(it.text, 4) : 0) + 60;
    if (f === "quote") return 40 + 28 * Math.ceil(String(it.text || "").length / ((w - 40) / 10.5)) + (it.source ? 26 : 0) + 30 + lab;
    if (f === "palette") return 14 + 40 * paletteOf(it).length + 30 + lab;
    if (f === "receipt") return 90 + 24 * parseTodos(it.text).filter((l) => l.todo || l.text.trim()).length + 100;
    return 40 + 22 * lines(it.text, 11) + 14 + lab;
  }

  // ---------- accession desk ----------
  let composerEl = null;
  function composer() {
    if (composerEl) return composerEl;
    const ta = h("textarea", { id: "composer-text", rows: "4", placeholder: "Type a thought, paste a link, a quote, a list with [ ], or a few #hex colours…", "aria-label": "New note" });
    const saveBtn = h("button", { class: "btn primary", type: "button", text: "Catalogue", disabled: true, onclick: () => submitComposer() });
    ta.addEventListener("input", () => {
      saveBtn.disabled = !ta.value.trim();
      ta.style.height = "auto";
      ta.style.height = Math.min(330, Math.max(88, Math.ceil(ta.scrollHeight / 22) * 22)) + "px";
    });
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitComposer(); }
      if (e.key === "Escape") ta.blur();
    });
    composerEl = h("section", { class: "spec composer", "aria-label": "Add something" },
      h("div", { class: "obj" },
        h("div", { class: "idx-head" }, h("span", { text: "New acquisition" }), h("span", { text: "CUR-" + "····" })),
        ta,
        h("div", { class: "bar" },
          h("label", { class: "btn", for: "file-input", text: "Image", tabindex: "0", onkeydown: (e) => { if (e.key === "Enter") $("#file-input").click(); } }),
          h("span", { class: "hint", text: "⌘↵" }),
          saveBtn)));
    return composerEl;
  }

  function classify(raw) {
    const text = raw.trim();
    const lines = text.split("\n");
    const first = lines[0].trim();
    if (/^(https?:\/\/|www\.)\S+$/i.test(first)) {
      const url = /^www\./i.test(first) ? "https://" + first : first;
      return { type: "link", url, text: lines.slice(1).join("\n").trim() };
    }
    const q = text.match(/^["“']([\s\S]+?)["”']\s*(?:\n|\s)*(?:[—–-]{1,2}\s*([^\n]+))?$/);
    if (q && q[1].length > 8) return { type: "quote", text: q[1].trim(), source: (q[2] || "").trim() };
    if (lines.every((l) => /^>\s?/.test(l) || /^[—–]\s*\S/.test(l))) {
      const body = lines.filter((l) => /^>/.test(l)).map((l) => l.replace(/^>\s?/, "")).join("\n").trim();
      const src = lines.find((l) => /^[—–]/.test(l));
      if (body) return { type: "quote", text: body, source: src ? src.replace(/^[—–]\s*/, "") : "" };
    }
    if (lines.length > 1 && first.length <= 70 && !/[.!?:]$/.test(first) && !/^\s*(?:[-*]\s*)?\[( |x)\]/i.test(first) && !HAS_HEX.test(first)) {
      return { type: "note", title: first, text: lines.slice(1).join("\n").replace(/^\n+/, "") };
    }
    return { type: "note", text };
  }

  function newItem(fields) {
    const now = Date.now();
    S.accMax += 1;
    return { id: uid(), title: "", text: "", tags: [], createdAt: now, updatedAt: now, aiStatus: "pending", acc: S.accMax, ...fields };
  }

  async function submitComposer() {
    const ta = $("#composer-text");
    const raw = ta.value;
    if (!raw.trim()) return;
    ta.value = "";
    ta.style.height = "";
    ta.dispatchEvent(new Event("input"));
    const item = newItem(classify(raw));
    if (paletteOf(item).length >= 2) item.tags = ["palette"];
    await save(item);
    toast("Catalogued as " + accLabel(item));
    enrich(item.id);
  }

  function save(item) {
    const next = { ...item, updatedAt: Date.now() };
    S.byId.set(next.id, next);
    return S.store.put(next);
  }

  // ---------- images ----------
  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error("image"));
      img.src = src;
    });
  }
  function drawScaled(img, max) {
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  const toBlob = (canvas, q) => new Promise((res) => canvas.toBlob(res, "image/jpeg", q));

  const COLOR_NAMES = [[15, "red"], [40, "orange"], [65, "yellow"], [160, "green"], [195, "teal"], [255, "blue"], [290, "purple"], [335, "pink"], [360, "red"]];
  function analyzeColors(img) {
    const c = drawScaled(img, 40);
    const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
    const bins = {};
    let r0 = 0, g0 = 0, b0 = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      r0 += d[i]; g0 += d[i + 1]; b0 += d[i + 2]; n++;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, delta = max - min;
      const s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
      let name;
      if (s < 0.18 || delta < 0.08) name = l > 0.82 ? "white" : l < 0.18 ? "black" : "grey";
      else {
        let hh = max === r ? ((g - b) / delta) % 6 : max === g ? (b - r) / delta + 2 : (r - g) / delta + 4;
        hh = (hh * 60 + 360) % 360;
        name = COLOR_NAMES.find(([lim]) => hh < lim)[1];
        if (name === "orange" && l < 0.4) name = "brown";
      }
      bins[name] = (bins[name] || 0) + (name === "grey" || name === "white" || name === "black" ? 0.6 : 1);
    }
    const colors = Object.entries(bins).sort((a, b) => b[1] - a[1]).filter(([, v]) => v / n > 0.12).slice(0, 2).map((x) => x[0]);
    const hex = (v) => Math.round(v / n).toString(16).padStart(2, "0");
    return { colors, tint: "#" + hex(r0) + hex(g0) + hex(b0) };
  }
  function cleanFileName(name) {
    const base = String(name || "").replace(/\.[a-z0-9]+$/i, "");
    if (!base || /^(img|dsc|pxl|screenshot|screen shot|photo|image|whatsapp image|untitled|example)[\s_-]*\d*$|^(img|dsc|pxl)[\s_-]*\d|^\d/i.test(base)) return "";
    return base.replace(/[_-]+/g, " ").trim();
  }

  async function addImageFile(file, extra = {}) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      const { colors, tint } = analyzeColors(img);
      const item = newItem({ type: "image", title: cleanFileName(file.name), w: img.naturalWidth, h: img.naturalHeight, colors, tint, ...extra });
      if (S.store.mode === "cloud" && S.assets) {
        try {
          const blob = file.type === "image/gif" && file.size < 15e6 ? file : await toBlob(drawScaled(img, 2000), 0.86);
          const r = await S.assets.upload(blob);
          item.assetId = r.id;
        } catch { /* fall back to an inline copy below */ }
      }
      if (!item.assetId) {
        const cloud = S.store.mode === "cloud";
        let max = cloud ? 900 : 1600, q = cloud ? 0.8 : 0.86, data;
        for (let tries = 0; tries < 6; tries++) {
          data = drawScaled(img, max).toDataURL("image/jpeg", q);
          if (!cloud || data.length < 190000) break;
          max = Math.round(max * 0.82); q = Math.max(0.5, q - 0.06);
        }
        item.image = data;
      }
      const aiBlob = S.ai.images && item.aiStatus === "pending" ? await toBlob(drawScaled(img, 1024), 0.82) : null;
      await save(item);
      toast("Catalogued as " + accLabel(item));
      if (item.aiStatus === "pending") enrich(item.id, aiBlob);
    } catch {
      toast("That file couldn't be read as an image. Try a JPG, PNG, GIF or WebP.");
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  // ---------- auto-tagging ----------
  const STOP = new Set("about above after again against all also and any are because been before being below between both but can could did does doing down during each few for from further had has have having her here hers herself him himself his how into its itself just let more most much must myself nor not now off once only other ought our ours ourselves out over own same she should some such than that the their theirs them themselves then there these they this those through too under until very was were what when where which while who whom why will with would you your yours yourself yourselves http https www com html really thing things like make made want need get got one two new note notes todo".split(" "));
  const DOMAIN_TAGS = {
    youtube: ["video"], youtu: ["video"], vimeo: ["video"], github: ["code"], gitlab: ["code"], figma: ["design"], dribbble: ["design", "inspiration"],
    behance: ["design", "inspiration"], pinterest: ["inspiration"], "are.na": ["inspiration"], instagram: ["social", "photo"], twitter: ["social"], "x.com": ["social"],
    linkedin: ["career"], spotify: ["music"], soundcloud: ["music"], bandcamp: ["music"], medium: ["article"], substack: ["newsletter", "article"],
    wikipedia: ["reference"], amazon: ["shopping"], takealot: ["shopping"], etsy: ["shopping"], airbnb: ["travel"], booking: ["travel"],
    nytimes: ["news", "article"], theguardian: ["news", "article"], bbc: ["news"], news24: ["news"], dailymaverick: ["news"], goodreads: ["books"],
    imdb: ["film"], letterboxd: ["film"], netflix: ["film"], notion: ["productivity"], arxiv: ["research", "paper"], "fonts.google": ["typography"],
  };
  function localEnrich(it) {
    const tags = [];
    if (it.url) {
      const site = siteName(it.url).toLowerCase();
      tags.push(...(DOMAIN_TAGS[site] || []));
      if (!DOMAIN_TAGS[site] && site.length < 16) tags.push(site);
    }
    if (it.type === "note" && /\[( |x)\]/i.test(it.text || "")) tags.push("to-do");
    if (paletteOf(it).length >= 2) tags.push("palette");
    if (it.type === "quote" && it.source) tags.push(it.source.toLowerCase().split(",")[0].trim());
    const words = [it.title, String(it.text || "").replace(HEX, ""), it.url ? titleFromUrl(it.url) : ""].join(" ").toLowerCase().match(/[a-z][a-z'-]{3,}/g) || [];
    const freq = {};
    for (const w of words) if (!STOP.has(w)) freq[w] = (freq[w] || 0) + 1;
    tags.push(...Object.entries(freq).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, 4).map((x) => x[0]));
    return { tags: uniq(tags.map(slugTag)).slice(0, 6), summary: "" };
  }

  function promptFor(it, withImage) {
    const lines = [
      "You are the curator of a personal cabinet of curiosities called Curio. Someone just added the item below to their collection.",
      "Return ONLY a JSON object of the form {\"title\": string, \"tags\": string[], \"summary\": string}.",
      "- title: a short, specific name for the item, at most 8 words. For a link, the most likely page title. If the person already gave a title, repeat it.",
      "- tags: 3 to 6 lowercase index terms of 1-2 words, mixing what it is (recipe, article, poster, to-do, palette) with what it is about (ceramics, cape town, typography). For images include the main subject and the mood or style.",
      "- summary: one plain sentence of at most 22 words for the catalogue record, describing it so it is easy to find later.",
      "",
      "Item type: " + it.type,
    ];
    if (it.title) lines.push("Title: " + it.title);
    if (it.url) lines.push("URL: " + it.url);
    if (it.text) lines.push("Text: " + String(it.text).slice(0, 3000));
    if (it.source) lines.push("Attributed to: " + it.source);
    if (it.colors && it.colors.length) lines.push("Dominant colours: " + it.colors.join(", "));
    if (withImage) lines.push("The image itself is attached.");
    else if (it.type === "image") lines.push("The image is not attached; tag from the title and colours only, and keep the summary generic.");
    return lines.join("\n");
  }

  async function imageBlobFor(it) {
    try {
      const img = await loadImage(imageSrc(it));
      return await toBlob(drawScaled(img, 1024), 0.82);
    } catch { return null; }
  }

  async function enrich(id, imageBlob, opts = {}) {
    const it = S.byId.get(id);
    if (!it) return;
    let result = null;
    if (S.ai.sample && !S.ai.off) {
      try {
        const o = { modelTier: "quick" };
        const withImage = !!(imageBlob && S.ai.images);
        if (withImage) o.images = [imageBlob];
        result = await S.ai.sample.json(promptFor(it, withImage), o);
      } catch (e) {
        const code = e && e.code;
        if (code === "not_granted") { S.ai.off = true; renderFooter(); }
        else if (code === "rate_limited") toast("Claude is busy, so this one was labelled on your device.");
      }
    }
    if (!result || typeof result !== "object" || !Array.isArray(result.tags)) result = localEnrich(it);
    const cur = S.byId.get(id);
    if (!cur) return;
    const fresh = result.tags.map(slugTag).filter((t) => t && t.length <= 32);
    const keep = opts.replace ? (cur.tags || []).filter((t) => t === "example" || (cur.userTags || []).includes(t)) : cur.tags || [];
    const next = { ...cur, tags: uniq([...keep, ...fresh]).slice(0, 9), aiStatus: "done" };
    if (!cur.title && typeof result.title === "string" && result.title.trim() && cur.type !== "note") next.title = result.title.trim().slice(0, 90);
    if (typeof result.summary === "string" && result.summary.trim()) next.summary = result.summary.trim().slice(0, 260);
    await save(next);
  }

  // ---------- lamplight ----------
  function vivid(hex) {
    const n = parseInt(String(hex).slice(1), 16);

      const item = newItem({ ...f, aiStatus: "done", summary: "" });
      item.createdAt = item.updatedAt = now - (i-- + 1) * 2 * 3600e3;
      await save(item);
    }
    await addImageFile(await paintExample(0), { title: "Colour study, blue sun", tags: ["example", "poster", "colour study"], createdAt: now - 1800e3, aiStatus: "done" });
  }
  async function clearExamples() {
    const ex = S.items.filter((i) => (i.tags || []).includes("example"));
    for (const it of ex) {
      await S.store.remove(it.id);
      if (it.assetId && S.assets) S.assets.delete(it.assetId).catch(() => {});
    }
    toast("Removed " + ex.length + " example specimens");
  }

  // ---------- footer ----------
  function renderFooter() {
    const m = S.store ? S.store.mode : null;
    $("#where").replaceChildren(h("span", { class: "dot" + (m === "cloud" ? " on" : "") }),
      m === "cloud" ? "Kept in your Claude account, private to you"
        : m === "local" ? "Kept in this browser only"
        : m === "memory" ? "Not saved: this browser is blocking storage" : "Starting…");
    $("#aiwhere").textContent = S.ai.sample && !S.ai.off ? "Labels written by Claude" : "Labels written on this device";
  }

  // ---------- global input ----------
  const q = $("#q");
  const onSearch = debounce(() => { S.query = q.value; namingSpace = false; render(); }, 120);
  q.addEventListener("input", () => { $("#q-clear").hidden = !q.value; onSearch(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Escape") { q.value = ""; $("#q-clear").hidden = true; S.query = ""; render(); q.blur(); } });
  $("#q-clear").addEventListener("click", () => { q.value = ""; $("#q-clear").hidden = true; S.query = ""; render(); q.focus(); });
  $("#file-input").addEventListener("change", async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    for (const f of files) await addImageFile(f);
  });
  $("#clear-examples").addEventListener("click", clearExamples);
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") { flushNow(); closeDetail(); } });
  $("#make").addEventListener("click", (e) => { e.stopPropagation(); togglePanel(); });
  $("#panel").addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => { if (!$("#panel").hidden) togglePanel(false); });

  let sheenRaf = 0;
  $("#wall").addEventListener("pointermove", (e) => {
    const spec = e.target.closest(".spec");
    if (!spec || e.pointerType !== "mouse") return;
    cancelAnimationFrame(sheenRaf);
    sheenRaf = requestAnimationFrame(() => {
      const r = spec.getBoundingClientRect();
      spec.style.setProperty("--mx", (e.clientX - r.left) + "px");
      spec.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });

  const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#panel").hidden) { togglePanel(false); $("#make").focus(); return; }
    if (e.key === "Escape" && S.openId) { flushNow(); closeDetail(); return; }
    if (S.openId || typing(document.activeElement) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); }
    else if (e.key === "n" && S.type === "all" && !S.query) { e.preventDefault(); $("#composer-text")?.focus(); }
  });

  document.addEventListener("paste", (e) => {
    if (!S.store) return;
    const files = [...(e.clipboardData?.files || [])].filter((f) => /^image\//.test(f.type));
    if (files.length && !(S.openId && typing(document.activeElement))) {
      e.preventDefault();
      files.forEach((f) => addImageFile(f));
      return;
    }
    if (typing(document.activeElement) || S.openId) return;
    const text = e.clipboardData?.getData("text/plain");
    if (text && text.trim()) {
      e.preventDefault();
      if (S.type !== "all" || S.query) { S.type = "all"; S.query = ""; q.value = ""; render(); }
      const ta = $("#composer-text");
      ta.value = text;
      ta.dispatchEvent(new Event("input"));
      ta.focus();
    }
  });

  let dragDepth = 0;
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
  window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; $("#drop").hidden = false; } });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    $("#drop").hidden = true;
    [...e.dataTransfer.files].forEach((f) => addImageFile(f));
  });

  let lastW = window.innerWidth;
  window.addEventListener("resize", debounce(() => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    if (columnCount() !== S.cols) render();
  }, 120));

  applyLook();
  LIQUID.attach($("#dock"), { bezel: 30, scale: 54 });
  LIQUID.attach($("#toast"), { bezel: 14, scale: 26 });
  render();
  renderFooter();
  connect();
})();
</script>
